name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'imamulkadir/Fyltrix'
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Validate tag, master ancestry, versions and changelog
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:GITHUB_REF -ne 'refs/heads/master') { throw 'Manual validation must run from master.' }
            $version = ([xml](Get-Content src/Fyltrix/Fyltrix.csproj -Raw)).Project.PropertyGroup.Version | Select-Object -First 1
            $env:RELEASE_TAG = "v$version"
          }
          git merge-base --is-ancestor HEAD refs/remotes/origin/master
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must belong to master.' }
          $release = ./tools/Test-Release.ps1 -Tag $env:RELEASE_TAG
          New-Item -ItemType Directory release-output | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD 'release-output/release-notes.md'), $release.Notes)
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT

      - name: Build and test application, updater and packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = 'tests/Fyltrix.Tests/Fyltrix.Tests.csproj', 'tests/Fyltrix.Updates.Tests/Fyltrix.Updates.Tests.csproj', 'tests/Fyltrix.Packaging.Tests/Fyltrix.Packaging.Tests.csproj'
          foreach ($project in $projects) {
            dotnet test $project -c Release --logger trx --results-directory release-output/tests
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $project" }
          }
          python -m unittest discover -s tests/installer -p test_builder.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Installer guard tests failed.' }
          python -m unittest discover -s tests/release -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Release tooling tests failed.' }

      - name: Package ZIP and compile Production Inno installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $PWD 'artifacts/distribution'
          ./tools/Publish-Layout.ps1 -Version $env:RELEASE_VERSION -OutputRoot $output
          $release = Join-Path $output $env:RELEASE_VERSION
          # Compile only. Never install or launch the Production identity in CI.
          ./tools/Build-Installer.ps1 -ReleaseDirectory $release -Mode Production
          $names = "Fyltrix-$env:RELEASE_VERSION-win-x64.zip", "Fyltrix-$env:RELEASE_VERSION-win-x64.zip.sha256"
          foreach ($name in $names) { Copy-Item -LiteralPath (Join-Path $release $name) -Destination release-output }
          foreach ($name in @('Fyltrix-Setup-win-x64.exe','Fyltrix-Setup-win-x64.exe.sha256')) {
            Copy-Item -LiteralPath (Join-Path $release "installer-Production/$name") -Destination release-output
          }

      - name: Attest package provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-output/Fyltrix-*-win-x64.zip
            release-output/Fyltrix-Setup-win-x64.exe

      - name: Create draft with changelog notes
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $files = @("release-output/Fyltrix-$env:RELEASE_VERSION-win-x64.zip", "release-output/Fyltrix-$env:RELEASE_VERSION-win-x64.zip.sha256", 'release-output/Fyltrix-Setup-win-x64.exe', 'release-output/Fyltrix-Setup-win-x64.exe.sha256')
          gh release create $env:RELEASE_TAG @files --repo imamulkadir/Fyltrix --draft --verify-tag --latest=false --title "Fyltrix $env:RELEASE_VERSION" --notes-file release-output/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed. Existing releases are never overwritten.' }

      - name: Upload build and test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-output/
          if-no-files-found: warn
          retention-days: 7
